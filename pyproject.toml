[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "causal-learning-analytics"
version = "0.2.0"
description = "Day-30 OULAD landmark study with inverse-probability weighting, balance diagnostics, refit uncertainty, and causal sensitivity analysis."
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "Devis Wawan Saputra"}]
readme = "README.md"
keywords = [
  "ai-in-education",
  "aied",
  "causal-inference",
  "learning-analytics",
  "propensity-score",
  "inverse-probability-weighting",
  "covariate-balance",
  "education-research",
]

[project.urls]
Repository = "https://github.com/devissaputra/causal_learning_analytics"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
