<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">Causal Learning Analytics synthetic demo snapshot</title>
<desc id="desc">Synthetic observational analysis showing raw and weighted effects, fixed-propensity bootstrap interval, common support, effective sample size and residual balance review.</desc>
<rect width="1200" height="340" rx="24" fill="#111827"/>
<text x="52" y="48" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="700" fill="#f9fafb">Synthetic observational demo</text>
<text x="52" y="76" font-family="Arial, Helvetica, sans-serif" font-size="14" fill="#aeb8c5">12 synthetic records · ATE target · software demonstration, not evidence of a causal effect.</text>

<rect x="52" y="112" width="250" height="110" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="70" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Raw / Hájek contrast</text>
<text x="70" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">0.245 → 0.237</text>

<rect x="320" y="112" width="250" height="110" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="338" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">95% bootstrap CI</text>
<text x="338" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">[0.196, 0.284]</text>

<rect x="588" y="112" width="250" height="110" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="606" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Common support</text>
<text x="606" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">0.44–0.58 · 83.3%</text>

<rect x="856" y="112" width="292" height="110" rx="14" fill="#1f2937" stroke="#46556a"/>
<text x="874" y="142" font-family="Arial" font-size="13" font-weight="600" fill="#93c5fd">Weight stability</text>
<text x="874" y="172" font-family="Arial" font-size="16" font-weight="600" fill="#f3f4f6">ESS 11.84 / 12 · max 2.38</text>

<text x="52" y="264" font-family="Arial" font-size="14" fill="#d1d5db">Balance example: baseline SMD 0.539 → 0.334; prior-engagement SMD 0.275 → 0.071.</text>
<text x="52" y="291" font-family="Arial" font-size="14" fill="#d1d5db">Review flags: causal_assumptions_unverified · post_weight_balance_problem</text>
<text x="52" y="317" font-family="Arial, Helvetica, sans-serif" font-size="13" fill="#8995a5">Run: python scripts/run_demo.py</text>
</svg>