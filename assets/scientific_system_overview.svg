<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1000"><rect width="1600" height="1000" fill="#f8fbff"/><text x="60" y="68" font-size="48" font-family="Arial" font-weight="700" fill="#12345b">Causal Learning Analytics</text><text x="62" y="108" font-size="23" font-family="Arial" fill="#5b6b82">Scientific System Overview · evidence, model structure, outputs, and validation</text><rect x="55" y="150" width="400" height="690" rx="24" fill="#eef6ff" stroke="#bfd0e2" stroke-width="2"/><text x="79" y="198" font-size="31" font-family="Arial" font-weight="700" fill="#12345b">Evidence & Inputs</text><rect x="500" y="150" width="530" height="690" rx="24" fill="#effaf6" stroke="#bfd0e2" stroke-width="2"/><text x="524" y="198" font-size="31" font-family="Arial" font-weight="700" fill="#12345b">Analytical Core</text><rect x="1080" y="150" width="465" height="690" rx="24" fill="#fff7ef" stroke="#bfd0e2" stroke-width="2"/><text x="1104" y="198" font-size="31" font-family="Arial" font-weight="700" fill="#12345b">Scientific Outputs</text><rect x="80" y="225" width="350" height="125" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="80" y="225" width="11" height="125" rx="5" fill="#2f80d1"/><text x="107" y="258" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Learning logs</text><text x="107" y="292" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Actions, timing, exposure, and</text><text x="107" y="314" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">participation</text><rect x="80" y="370" width="350" height="125" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="80" y="370" width="11" height="125" rx="5" fill="#1e9e94"/><text x="107" y="403" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Interventions</text><text x="107" y="437" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Feedback, resources, prompts, or policy</text><text x="107" y="459" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">treatments</text><rect x="80" y="515" width="350" height="125" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="80" y="515" width="11" height="125" rx="5" fill="#f07a28"/><text x="107" y="548" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Context variables</text><text x="107" y="582" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Prior achievement, demographics, course,</text><text x="107" y="604" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">and environment</text><rect x="80" y="660" width="350" height="125" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="80" y="660" width="11" height="125" rx="5" fill="#7354b5"/><text x="107" y="693" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Outcomes</text><text x="107" y="727" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Achievement, retention, engagement, or</text><text x="107" y="749" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">transfer</text><rect x="525" y="225" width="480" height="105" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="525" y="225" width="11" height="105" rx="5" fill="#1e9e94"/><text x="552" y="258" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Causal graph</text><text x="552" y="292" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Encode assumptions about treatment,</text><text x="552" y="314" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">outcome, and confounding</text><rect x="525" y="343" width="480" height="105" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="525" y="343" width="11" height="105" rx="5" fill="#2f80d1"/><text x="552" y="376" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Identification</text><text x="552" y="410" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Backdoor / IV / DiD / longitudinal</text><text x="552" y="432" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">strategy</text><rect x="525" y="461" width="480" height="105" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="525" y="461" width="11" height="105" rx="5" fill="#f07a28"/><text x="552" y="494" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Adjustment</text><text x="552" y="528" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Matching, weighting, regression, or doubly</text><text x="552" y="550" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">robust methods</text><rect x="525" y="579" width="480" height="105" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="525" y="579" width="11" height="105" rx="5" fill="#7354b5"/><text x="552" y="612" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Heterogeneity</text><text x="552" y="646" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Estimate conditional treatment effects</text><text x="552" y="668" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">cautiously</text><rect x="525" y="697" width="480" height="105" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="525" y="697" width="11" height="105" rx="5" fill="#3f9458"/><text x="552" y="730" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Sensitivity</text><text x="552" y="764" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Overlap, placebo, negative-control, and</text><text x="552" y="786" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">unobserved-confounding checks</text><rect x="1105" y="225" width="415" height="115" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="1105" y="225" width="11" height="115" rx="5" fill="#2f80d1"/><text x="1132" y="258" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">ATE / CATE</text><text x="1132" y="292" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Effect estimates with uncertainty</text><rect x="1105" y="358" width="415" height="115" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="1105" y="358" width="11" height="115" rx="5" fill="#f07a28"/><text x="1132" y="391" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Balance evidence</text><text x="1132" y="425" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Overlap and covariate diagnostics</text><rect x="1105" y="491" width="415" height="115" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="1105" y="491" width="11" height="115" rx="5" fill="#3f9458"/><text x="1132" y="524" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Robustness profile</text><text x="1132" y="558" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Sensitivity across identification choices</text><rect x="1105" y="624" width="415" height="115" rx="15" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><rect x="1105" y="624" width="11" height="115" rx="5" fill="#7354b5"/><text x="1132" y="657" font-size="21" font-family="Arial" font-weight="700" fill="#12345b">Decision support</text><text x="1132" y="691" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">Policy simulations clearly tied to</text><text x="1132" y="713" font-size="16" font-family="Arial" font-weight="400" fill="#5b6b82">assumptions</text><line x1="430" y1="485" x2="500" y2="485" stroke="#1e9e94" stroke-width="7"/><polygon points="500,485 478,470 478,500" fill="#1e9e94"/><line x1="1030" y1="485" x2="1080" y2="485" stroke="#f07a28" stroke-width="7"/><polygon points="1080,485 1058,470 1058,500" fill="#f07a28"/><rect x="55" y="865" width="1490" height="95" rx="20" fill="#fff" stroke="#bfd0e2" stroke-width="2"/><text x="80" y="900" font-size="24" font-family="Arial" font-weight="700" fill="#12345b">Research checks</text><circle cx="300" cy="895" r="12" fill="#2f80d1"/><text x="320" y="902" font-size="17" font-family="Arial" fill="#5b6b82">reproducibility</text><circle cx="490" cy="895" r="12" fill="#1e9e94"/><text x="510" y="902" font-size="17" font-family="Arial" fill="#5b6b82">uncertainty</text><circle cx="680" cy="895" r="12" fill="#f07a28"/><text x="700" y="902" font-size="17" font-family="Arial" fill="#5b6b82">calibration</text><circle cx="870" cy="895" r="12" fill="#7354b5"/><text x="890" y="902" font-size="17" font-family="Arial" fill="#5b6b82">fairness</text><circle cx="1060" cy="895" r="12" fill="#3f9458"/><text x="1080" y="902" font-size="17" font-family="Arial" fill="#5b6b82">ablation</text><circle cx="1250" cy="895" r="12" fill="#cc4a4a"/><text x="1270" y="902" font-size="17" font-family="Arial" fill="#5b6b82">external validity</text><text x="1000" y="940" font-size="23" font-family="Georgia" font-style="italic" fill="#12345b">τ = E[Y(1) − Y(0)] under stated identification assumptions</text><text x="80" y="944" font-size="14" font-family="Arial" fill="#5b6b82">Conceptual schematic only · empirical values are reported separately in repository outputs.</text></svg>