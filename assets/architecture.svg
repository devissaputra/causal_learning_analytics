<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" role="img" aria-labelledby="title desc">
<title id="title">OULAD day-30 landmark causal learning analytics architecture</title>
<desc id="desc">Real OULAD records flow through landmark eligibility, non-banked exposure construction, baseline propensity adjustment, diagnostics, uncertainty and sensitivity analyses.</desc>
<defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#64748b"/></marker></defs>
<rect width="1200" height="380" rx="24" fill="#f8fafc"/>
<text x="48" y="48" font-family="Arial" font-size="26" font-weight="700" fill="#0f172a">Causal Learning Analytics · day-30 landmark architecture</text>
<text x="48" y="78" font-family="Arial" font-size="15" fill="#475569">Eligibility and exposure are completed by day 30; final outcome is evaluated afterward.</text>

<rect x="38" y="125" width="210" height="128" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="143" y="158" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">OULAD source</text>
<text x="143" y="184" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">registration + unregistration</text>
<text x="143" y="206" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">assessment + banked flag</text>
<text x="143" y="228" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">final course outcome</text>

<line x1="258" y1="189" x2="305" y2="189" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

<rect x="315" y="111" width="235" height="156" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="432" y="145" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">Day-30 landmark</text>
<text x="432" y="172" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">registered by day 30</text>
<text x="432" y="194" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">not withdrawn by day 30</text>
<text x="432" y="216" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">non-banked submission exposure</text>
<text x="432" y="238" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">one module-presentation only</text>

<line x1="560" y1="189" x2="607" y2="189" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

<rect x="617" y="111" width="245" height="156" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="739" y="145" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">Measured adjustment</text>
<text x="739" y="172" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">numeric standardization</text>
<text x="739" y="194" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">categorical one-hot encoding</text>
<text x="739" y="216" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">logistic propensity model</text>
<text x="739" y="238" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">ATE weights + overlap sensitivity</text>

<line x1="872" y1="189" x2="919" y2="189" stroke="#64748b" stroke-width="2.5" marker-end="url(#arrow)"/>

<rect x="929" y="100" width="235" height="178" rx="16" fill="#ffffff" stroke="#2563eb" stroke-width="2"/>
<text x="1046" y="134" text-anchor="middle" font-family="Arial" font-size="16" font-weight="700" fill="#0f172a">Evidence</text>
<text x="1046" y="161" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">overlap · balance · ESS</text>
<text x="1046" y="183" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">HT + Hajek contrasts</text>
<text x="1046" y="205" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">full-refit bootstrap</text>
<text x="1046" y="227" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">support + specification sensitivity</text>
<text x="1046" y="249" text-anchor="middle" font-family="Arial" font-size="13" fill="#475569">explicit non-causal boundary</text>

<text x="48" y="326" font-family="Arial" font-size="14" fill="#475569">The design reduces temporal misclassification. It does not prove exchangeability or eliminate unmeasured confounding.</text>
</svg>
