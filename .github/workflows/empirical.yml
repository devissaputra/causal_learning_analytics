name: Empirical Study

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_oulad_study.py"
      - "src/**"
      - "requirements.txt"
      - "requirements-repro.txt"
      - "tests/**"
      - ".github/workflows/empirical.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: empirical-study-main
  cancel-in-progress: false

jobs:
  run-study:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-repro.txt
      - name: Run research-bundle tests
        run: python -m unittest discover -s tests -v
      - name: Run external-data study
        run: python scripts/run_oulad_study.py
      - name: Commit generated evidence
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/oulad_metrics.json results/summary.md results/figures paper/results.md
          if git diff --cached --quiet; then
            echo "No result changes"
          else
            git commit -m "research: regenerate OULAD causal results"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
