name: Empirical Study

on:
  push:
    branches: [main]
    paths:
      - "scripts/run_oulad_study.py"
      - "src/**"
      - "requirements.txt"
      - "requirements-repro.txt"
      - "tests/**"
      - ".github/workflows/empirical.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: empirical-study-main
  cancel-in-progress: true

jobs:
  run-study:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-repro.txt
      - name: Run research-bundle tests
        run: python -m unittest discover -s tests -v
      - name: Run external-data study
        run: python scripts/run_oulad_study.py
      - name: Publish generated evidence safely
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            python scripts/run_oulad_study.py
            git add results/oulad_metrics.json results/summary.md results/figures paper/results.md
            if git diff --cached --quiet; then
              echo "No result changes"
              exit 0
            fi
            git commit -m "research: regenerate OULAD landmark results"
            if git push origin HEAD:main; then
              exit 0
            fi
            echo "Push raced with a newer main commit; regenerating against latest main"
          done
          echo "Could not publish generated evidence after three attempts"
          exit 1
