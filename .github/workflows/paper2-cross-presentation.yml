name: "Paper 2 - cross-presentation bootstrap verification"
on:
  push:
    branches:
      - research/paper2-cross-presentation-final-20261022
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install independent analysis dependencies
        run: python -m pip install 'numpy==2.3.5' 'pandas==2.2.3' 'scikit-learn==1.8.0'
      - name: Run full-refit 1000-resample bootstrap on each of three fixed presentations
        run: python scripts/independent_cross_presentation_bootstrap.py
      - name: Validate output and preserve aggregate evidence
        run: |
          python - <<'PY'
          import json
          d=json.load(open("results/paper2_cross_presentation_bootstrap_20261022.json"))
          assert len(d["presentations"])==3
          for x in d["presentations"]:
            assert x["bootstrap"]["resamples_valid"]>=950
            assert x["bootstrap"]["resamples_requested"]==1000
            assert len(x["bootstrap"]["ipw_95ci"])==2
          print("PASS: all three presentations full-refit uncertainty available")
          PY
      - name: Upload verified aggregate report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper2-cross-presentation-bootstrap
          path: results/paper2_cross_presentation_bootstrap_20261022.json
          if-no-files-found: warn
      - name: Commit aggregate output to verification branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/paper2_cross_presentation_bootstrap_20261022.json
          if git diff --cached --quiet; then
            echo "No numerical output changes"
          else
            git commit -m "research: archive three presentation full-refit intervals"
            git push origin HEAD:research/paper2-cross-presentation-final-20261022
          fi
